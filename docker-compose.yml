version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quickdesk_db
    restart: always
    environment:
      POSTGRES_USER: quickdesk
      POSTGRES_PASSWORD: quickdesk
      POSTGRES_DB: quickdesk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickdesk -d quickdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickdesk_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://quickdesk:quickdesk@db:5432/quickdesk
      JWT_SECRET_KEY: quickdesk_super_secret_jwt_key_2026_dev_env_32chars!
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      AI_PROVIDER: mock
      HUGGINGFACE_API_KEY: ""
      HUGGINGFACE_MODEL: meta-llama/Llama-3.2-3B-Instruct
      GROQ_API_KEY: ""
      GROQ_MODEL: llama-3.1-8b-instant
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    command: >
      sh -c "python app/seeds/seed.py &&
             python -m uvicorn app.main:socket_app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickdesk_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
